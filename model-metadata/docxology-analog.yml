methods_long: "Proposed candidate docxology-analog; implementation hum_disease.forecasting, model ID hum-analog-phase, version 1.0.0. Direct multi-horizon median of twelve past trajectories matched on two recent increments, epidemic level, and annual phase. Analog matching and residual calibration use each location's own history. There is no explicit cross-location spatial model. Predictive uncertainty comes from level-matched pseudo-out-of-sample residual quantiles. Target: wk inc covid hosp. Requested forecast horizons: [0, 1, 2, 3]. Submission value policy: float; the submission adapter enforces nonnegative monotone quantiles. Each future submission must retain its actual input vintage, source/config identities and local validation. This draft does not assert scientific superiority, prospective selection/freeze, organizer registration or acceptance. Development-based configuration choices do not establish performance on this disease. Registered model identity: 2c8d21646d28ca1dc9c9344551f1253353705acf772a6e7c44563d8117b85be4. Canonical configuration: {\"aggregation\": \"median\", \"analog_neighbours\": 48, \"delta_clamp\": 2.5, \"development_seasons\": [\"2023/24\", \"2024/25\"], \"forecast_form\": \"direct-steps-ahead-trajectory-analog\", \"history_origins\": 208, \"increment_window\": 2, \"level_weight\": 0.2, \"max_backtest_origins\": 208, \"min_fit_points\": 16, \"min_residuals\": 12, \"neighbours\": 12, \"phase_weight\": 0.5, \"transform\": \"log1p\", \"uncertainty\": \"level-matched pseudo-out-of-sample residual quantiles\"}"
