methods: "EpiRSI: LLM-agent-written data skills for frozen foundation models and boosted trees, verified on past seasons; greedy ensemble selection, repeated weekly from 2026-11-21; no LLM at forecast time."
data_inputs: "NHSN weekly COVID-19 admissions (hub target data as available at the deadline); NSSP percent of emergency-department visits with COVID-19 and ILINet (Delphi Epidata, versions as of the deadline); US holiday calendar."
methods_long: "Experts run every week on the data available at the deadline: Chronos-2, TimesFM-3 and Toto-2 whose inputs are built by an agent-written skill (history back-extended with NSSP; the NSSP signal extended over its reporting lag with a renewal-equation projection from the reproduction number estimated with a COVID-19 generation-interval prior; newest-week admissions corrected when they lag the ED signal; old waves far above the recent level compressed; national per-capita and holiday covariates), pooled LightGBM quantile regression on lagged features (also with NSSP as a joint series and with ILINet covariates), a LightGBM quantile regression whose training table is built by an agent-written skill (newest weeks raised by the reporting-revision estimate made at the deadline; history back-extended with NSSP and ILINet and limited to the last three years; trailing weeks that fall away from the ED signal treated as incomplete except in holiday weeks; per-capita scaling with a population-weighted national series; log-scale cross-location z-scores and wave-phase features of peer jurisdictions; partly computed with a tool library the agent wrote in an earlier search round), and two simple mechanistic models. Skills were proposed by an LLM agent (Gemini 3.1 Pro) and accepted only if they improved the score in at least two thirds of 6 past seasons rebuilt with the data as of each deadline (NHSN 2024-25, HHS Protect 2021-2024, NSSP 2022-2024). The forecast is a weighted average of the experts in log space: members and weights are chosen by greedy forward ensemble selection with replacement (Caruana et al. 2004) on the same 6 past seasons (the skill-built LightGBM 0.5, Chronos-2 with the skill inputs 0.4, the SIR model 0.1). From the round of 2026-11-21 (pre-registered 2026-11-03, re-registered 2026-11-12) the selection is repeated every week with the current season added as one more season of equal weight (its earlier rounds scored against the truth matured by the deadline); with fewer than 100 such cells the fixed selection is kept. The experts, their weights before the season and the weekly re-selection rule are fixed; no LLM at forecast time. Backfill: the newest reported week is raised towards the growth implied by the ED-visit signal when it grows clearly less (by at most x1.5). During the season the members change only when a new expert passes the same multi-season test and the change is pre-registered before its first use (model_version names the deployed version); no manual adjustment; the LLM is not called at forecast time."
