data_inputs: "CDC COVID-19 Forecast Hub weekly COVID-19 hospital admissions, NSSP COVID-19 emergency department visit proportions, jurisdiction populations, and historical admissions releases used to estimate reporting revisions"
methods: "Recursive quantile regression blended with phase-aware historical analogs and cross-state information."
methods_long: "The model forecasts weekly COVID-19 hospital admissions at horizons 0 through 3 by combining a location-specific recursive quantile regression forecast with phase-aware historical analogs and a quantile regression trained on pooled state data. The component weights and other model choices are selected using validation forecasts. Recursive predictions are fed back into the features to forecast subsequent weeks. Predictors include recent admissions, trends, seasonality, the share of states with rising admissions, and, when sufficient data are available, growth in the NSSP COVID-19 emergency department visit proportion. The model applies a damped growth cap and a noise-aware near-peak rule. Prediction intervals are calibrated using horizon-specific errors from validation forecasts. Recent admissions are adjusted for typical reporting revisions when suitable release history is available."
