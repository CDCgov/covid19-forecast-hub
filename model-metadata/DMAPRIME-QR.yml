data_inputs: "CDC NHSN weekly COVID-19 hospital admissions and NSSP percent of emergency department visits due to COVID-19 for all US states, DC, Puerto Rico and the US national total (COVID-19 Forecast Hub target data), jurisdiction populations, and past weekly admissions releases used to estimate reporting revisions"
methods: "Gradient-boosted quantile regression (LightGBM) pooled across all US locations, forecasting each horizon directly from NHSN admissions and NSSP ED share, with corrections for incomplete reporting."
methods_long: "Forecasts are produced for all 53 hub locations: the 50 states, the District of Columbia, Puerto Rico and the US national total. Quantile regression with gradient-boosted trees (LightGBM, quantile objective): one model per horizon (0-3 weeks) and quantile level (23), trained jointly on all US states, DC, Puerto Rico and the national total. Each model predicts the change in log weekly admissions from the last observed week to the target week directly, without recursion. Inputs are admission growth over the past 1-4 weeks, admissions per 100,000, distance below the past-year peak, the NSSP COVID-19 ED-visit share (level, 1- and 2-week growth, distance below its past-year peak, and ED growth minus admission growth), national admission and ED growth, season timing and population. Models are trained once per season on weekly data from October 2022 up to August 1. Before forecasting, each location's latest three weeks of admissions are raised by their typical upward revision, the median ratio of later to first-reported values in the hub's past weekly releases. The newest week is then treated as incompletely reported and held at the previous week's level when it falls by 15% or more from a previous week of at least 10 admissions while the location's ED-visit share does not fall by more than 5%, or, where no ED data exist (Puerto Rico), when it falls by 50% or more. Predicted quantiles are sorted to prevent crossing and widened around the median by a factor that depends on the horizon and the location's latest weekly admissions (under 20, 20-99, or 100 or more), learned from real-time replays of the 2025-26 season. Updated November 2026."
