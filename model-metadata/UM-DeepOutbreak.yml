data_inputs: "Google's symptom search data, and CDC's ILI and WHO/NREVSS data."
methods: "Ensemble of a guided time-series diffusion model and a transformer (M-SPICE TS), calibrated with Neural Conformal Control."
methods_long: "Ensemble of two deep learning forecasters whose forecasts are averaged, followed by post hoc conformal calibration. (1) A diffusion model specifically designed for time-series modeling, which applies classifier guidance based on time-series features to make effective, data-driven corrections to the forecast horizon, thereby achieving reliable predictions. (2) M-SPICE TS, a transformer-based forecasting model that leverages historical respiratory disease surveillance time-series data to predict COVID-19 hospitalizations. The model uses temporal self-attention to capture patterns and dependencies across multiple surveillance indicators and generate multi-week-ahead forecasts. Uncertainty quantification is conducted post hoc with Neural Conformal Control (NCC), which takes the ensemble's point forecasts and uses a neural network, trained jointly across locations, to learn prediction intervals for each target error rate that keep their coverage over time under distribution shifts. Spatial correlation is not considered."
citation: "Rodriguez, A., Tabassum, A., Cui, J., Xie, J., Ho, J., Agarwal, P., Adhikari, B. and Prakash, B.A., 2021, May. Deepcovid: An operational deep learning-driven framework for explainable real-time covid-19 forecasting. In Proceedings of the AAAI Conference on Artificial Intelligence (Vol. 35, No. 17, pp. 15393-15400). https://ojs.aaai.org/index.php/AAAI/article/view/17808; Li, R. and Rodríguez, A., 2025. Neural Conformal Control for Time Series Forecasting. In Proceedings of the AAAI Conference on Artificial Intelligence (Vol. 39). https://arxiv.org/abs/2412.18144"
