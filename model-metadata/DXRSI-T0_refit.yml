data_inputs: 'COVID-19 Forecast Hub target data only (target-data/time-series.parquet with as_of versions): weekly NHSN laboratory-confirmed COVID-19 hospital admissions and weekly NSSP proportion of ED visits due to COVID-19.'
methods: 'Median of 3 quantile forecasters: seasonal naive with empirical errors, persistence with pooled log-change quantiles, LightGBM quantile regression. All parameters re-fitted every week.'
methods_long: 'Same forecasting program as the T0 model of this team, used as the weekly-refit arm of a prospective study of automated forecast-program improvement: the program code is fixed but all parameters are re-estimated every week on the latest target data. Inputs are only the hub''s weekly target series. Three component forecasters produce the 23 quantiles for each location and horizon: (A) seasonal naive (the value 52 weeks before the target week) plus empirical quantiles of the location''s own 52-week differences over the last three years; (B) persistence of the last observation plus quantiles of symmetrised log(1+y) changes pooled across locations within size terciles; (C) LightGBM quantile regression (one model per quantile level) pooled across locations and horizons, using recent log levels, differences, seasonal lags and week of year. The component quantiles are combined by their median at each level and sorted. Locations are modelled independently apart from pooling of parameters; there is no explicit spatial correlation. Uncertainty comes from the empirical error and change distributions and the quantile regressions. The horizon -1 week is nowcast from the first released value times empirical first-release-to-latest revision ratios. Version history: from 2026-11-21: t0_ensemble-1 (program sha256 63af89d98876), program t0_ensemble.py; all parameters re-fitted every week.'
ensemble_of_models: true
