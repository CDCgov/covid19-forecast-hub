designated_model: true
data_inputs: "Public COVID-19 Forecast Hub target data only: NHSN weekly confirmed COVID-19 hospital admissions and NSSP weekly proportion of ED visits due to COVID-19, for all states, DC, PR and the US. No EHR or other private data."
methods: "Pooled hybrid CNN-LSTM trained on all U.S. jurisdictions; forecasts quantiles of the log change from the last observed week; 3-seed ensemble with per-horizon calibration."
methods_long: "One hybrid CNN-LSTM per target is trained jointly on all locations (50 states, DC, PR, US), using only public COVID-19 Forecast Hub target data; the same model as DMAPRIME-HYB in the FluSight Forecast Hub. Each series is transformed to z = log1p(value), with the ED proportion expressed in percent. Admissions from the weeks of voluntary NHSN reporting (May 1 to October 31, 2024) are left out. Inputs are a 10-week window of: z relative to the last observed week, weekly change, and level standardized by the location's own history, for both targets; the national z and its weekly change; and seasonal sin/cos terms. The network uses parallel 1-D convolutions (kernels 3 and 5), a 2-layer bidirectional LSTM and attention pooling, and outputs the 23 quantiles of the change in z from the last observed week for horizons 0-3, trained with pinball loss. Spatial correlation is not modeled explicitly; locations share parameters and see national dynamics as inputs. Uncertainty comes from the quantile outputs, averaged over three random seeds, and the spread around the median is scaled by per-target, per-horizon calibration factors chosen to minimize WIS on past out-of-sample forecasts. The model is retrained every week on the latest data."
