name: "Hub Submission Validation (R)"

on:
  workflow_dispatch:
  pull_request:
    branches: main

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-submission:
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v7

      - name: "Get model output directory changes"
        id: "model_output_diffs"
        uses: step-security/changed-files@v47
        with:
          path: model-output
          dir_names: "true"

      # point at fork until install R option merged to main or rejected
      - uses: hubverse-org/hubverse-actions/validate-submission@main
        with:
          summary: true
          skip_submit_window_check: true
